<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Registration Center</title>
  
  <!-- Google Ads Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      margin: 0;
      padding: 0;
    }

    header {
      background-image: url('your-header-bg.jpg');
      background-size: cover;
      background-position: center;
      padding: 30px;
      text-align: center;
      color: black;
      position: relative;
    }

    .language-selector {
      position: absolute;
      top: 10px;
      right: 20px;
    }

    .language-selector select {
      padding: 8px 12px;
      border-radius: 5px;
      border: none;
      font-size: 14px;
      color: white;
      background-color: black;
    }

    nav {
      background-color: green;
      padding: 10px 20px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .card {
      background-color: #fff;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card button, .register-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      background-color: #2e7d32;
      color: white;
      text-align: center;
      padding: 20px;
    }

    marquee {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="Phase2a.html" id="nav-home">Home</a></li>
      <li><a href="Phase2a.html" id="nav-pay">Pay Now</a></li>
      <li><a href="Phase2a.html" id="nav-standards">Standards</a></li>
      <li><a href="Phase2a.html" id="nav-support">Support</a></li>
    </ul>
  </nav>

  <header>
    <div class="language-selector">
      <select onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="am">አማርኛ</option>
        <option value="or">Afaan Oromo</option>
      </select>
    </div>
    <h1 id="header-title"></h1>
    <marquee id="marquee-text"></marquee>
  </header>

  <!-- Google Ad Unit (Header area) -->
  <div style="text-align: center; margin-top: 20px;">
    <ins class="adsbygoogle"
         style="display:block; width: 100%; height: 100px;"
         data-ad-client="ca-pub-XXXXXXX" <!-- Replace with your AdSense client ID -->
         data-ad-slot="XXXXXXX"          <!-- Replace with your AdSense ad slot ID -->
         data-ad-format="auto"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <div class="container">
    <div class="card">
      <h2 id="card1-title"></h2>
      <button onclick="location.href='Phase2a.html'" id="card1-button"></button>
    </div>

    <div class="card">
      <h2 id="card2-title"></h2>
      <table border="1" align="center">
        <tr><th>Name</th><th>Amount</th></tr>
        <tr><td>Gemech</td><td>100,000,000 ETB</td></tr>
        <tr><td>Aster</td><td>90,000,000 ETB</td></tr>
        <tr><td>alex</td><td>80,000,000 ETB</td></tr>
        <tr><td>Fraol</td><td>75,000,000 ETB</td></tr>
        <tr><td>kebede</td><td>50,000,000 ETB</td></tr>
      </table>
    </div>

    <div class="card">
      <h2 id="card3-title"></h2>
      <img src="sample-id.png" alt="ID Sample" style="width:100%; border-radius:10px;"/>
    </div>

    <div class="card">
      <h2 id="card4-title"></h2>
      <p id="card4-desc"></p>
      <button onclick="location.href='Phase2a.html'" id="card4-button"></button>
    </div>
  </div>

  <!-- Google Ad Unit (Footer area) -->
  <div style="text-align: center; margin-top: 20px;">
    <ins class="adsbygoogle"
         style="display:block; width: 100%; height: 100px;"
         data-ad-client="ca-pub-XXXXXXX" <!-- Replace with your AdSense client ID -->
         data-ad-slot="XXXXXXX"          <!-- Replace with your AdSense ad slot ID -->
         data-ad-format="auto"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script>
    const translations = {
      en: {
        "nav-home": "Home",
        "nav-pay": "Pay Now",
        "nav-standards": "Standards",
        "nav-support": "Support",
        "header-title": "Welcome to the Global Registration Center",
        "marquee-text": "To register, press below",
        "card1-title": "Check Your Balance",
        "card1-button": "Go to Balance",
        "card2-title": "Top Payments for Ethiopians",
        "card3-title": "Sample ID",
        "card4-title": "About Us",
        "card4-desc": "We support innovation and youth empowerment.",
        "card4-button": "Register Now",
        "footer-text": "© 2025 Ethiopian Innovation Group"
      },
      am: {
        "nav-home": "መነሻ",
        "nav-pay": "አሁን ክፈል",
        "nav-standards": "መመሪያዎች",
        "nav-support": "ድጋፍ",
        "header-title": "እንኳን ወደ ዓለም አቀፍ መለያ መስመር በደህና መጡ",
        "marquee-text": "ለመመዝገብ ከዚህ በታች ይጫኑ",
        "card1-title": "ቀሪ ሂሳብዎን ያረጋግጡ",
        "card1-button": "ወደ ቀሪ ሂሳብ ይሂዱ",
        "card2-title": "ለኢትዮጵያውያን ከፍተኛ ክፍያዎች",
        "card3-title": "የመለያ ካርድ ናሙና",
        "card4-title": "ስለእኛ",
        "card4-desc": "እኛ ፈጠራና ወጣቶችን መበልጸጊያ ነን።",
        "card4-button": "አሁን ይመዝገቡ",
        "footer-text": "© 2025 የኢትዮጵያ ፈጠራ ቡድን"
      },
      or: {
        "nav-home": "Mana",
        "nav-pay": "Amma Kaffalu",
        "nav-standards": "Heeraalee",
        "nav-support": "Degersa",
        "header-title": "Baga Nagaan Dhuftan Gara Galmee Addunyaa",
        "marquee-text": "Galmee gochuuf gaditti cuqaasi",
        "card1-title": "Himannaa Keessan Sakatta’aa",
        "card1-button": "Gara Himannaa",
        "card2-title": "Kaffaltii Gurguddaa Uummata Itoophiyaa",
        "card3-title": "Fakkeenya Kaarraa",
        "card4-title": "Waa'ee Keenya",
        "card4-desc": "Deeggarsa dargaggootaa fi kalaqaaf hojjenna.",
        "card4-button": "Amma Galmaa'i",
        "footer-text": "© 2025 Garee Innooveeshinii Itoophiyaa"
      }
    };

    function changeLanguage(lang) {
      for (const id in translations[lang]) {
        const element = document.getElementById(id);
        if (element) element.innerText = translations[lang][id];
      }
    }

    // Set default to English
    changeLanguage('en');
  </script>
</body>
</html>
